<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 280px;
        padding: 14px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      #status {
        font-size: 12.5px;
        padding: 8px 10px;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      #status.connected {
        background: #e8f5e9;
        color: #2e7d32;
      }
      #status.disconnected {
        background: #fff3e0;
        color: #e65100;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        font-size: 11px;
        height: 50px;
        margin-bottom: 6px;
      }
      button {
        width: 100%;
        padding: 7px;
        font-size: 12.5px;
        cursor: pointer;
      }
      p {
        font-size: 11.5px;
        color: #666;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>CareerAutomated Autofill</h1>
    <div id="status">Checking…</div>
    <p>
      Open a Greenhouse job application page and click the "Autofill" button
      it adds to the page. Auth is picked up automatically while you're
      logged into careerautomated.in — paste a token below only if that
      didn't work.
    </p>
    <textarea id="tokenInput" placeholder="Paste API token (fallback only)"></textarea>
    <button id="saveToken">Save token</button>
    <script src="popup.js"></script>
  </body>
</html>
