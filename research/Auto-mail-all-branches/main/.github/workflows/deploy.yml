# Deploys to your GCP Compute VM on every push to `main`.
#
# Required GitHub repository secrets:
#   GCP_VM_IP            — public IP or hostname of the VM
#   GCP_VM_USER          — SSH user (e.g. ubuntu or your Linux user)
#   GCP_SSH_PRIVATE_KEY  — full private key (PEM), including -----BEGIN ... END-----
#
# On the server:
#   - Repo cloned at ~/auto-mail (change DEPLOY_DIR below if yours differs)
#   - Docker + Docker Compose plugin installed
#   - `origin` remote points at this GitHub repo

name: Deploy to GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gcp-main
  cancel-in-progress: true

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Backend — install & test
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import main"
          pytest tests/ -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Frontend — lint & build
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Deploy to VM
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - name: SSH — pull main & restart Docker
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_DIR="${HOME}/auto-mail"
            cd "$DEPLOY_DIR"
            git fetch origin
            git checkout main
            git reset --hard origin/main
            docker compose build --no-cache
            docker compose up -d --force-recreate
            docker image prune -f
