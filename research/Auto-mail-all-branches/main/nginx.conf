# ──────────────────────────────────────────────────────────────────────────────
# Nginx config for limitless-ai.in
#
# How this works:
#   - The "frontend" Docker container runs Nginx
#   - Nginx serves your compiled React app (static HTML/JS/CSS)
#   - When the browser calls /api/*, Nginx forwards it to the "backend" container
#     internally (Docker's private network) — the backend is NEVER exposed publicly
#   - After running Certbot on the server, it adds the SSL section automatically
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name limitless-ai.in www.limitless-ai.in;

    # Always redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name limitless-ai.in www.limitless-ai.in;

    # ── Let's Encrypt Certificates ────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/limitless-ai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limitless-ai.in/privkey.pem;

    # Strong SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # ── Static React App ──────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── Health endpoint ───────────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;
}
