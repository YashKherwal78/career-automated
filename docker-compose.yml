version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: career_redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: career_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: career_worker
    command: python3 src/workers/mass_scheduler.py
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    networks:
      - default
      - dokploy-network
    restart: always

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: career_scheduler
    command: python3 src/discovery/scheduler/main_scheduler.py
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    restart: always

  # job_scorer (JobScoringWorker) intentionally disabled 2026-08-20: it ran
  # IntentFilter/JDExtractor (LLM-based structured scoring) to rank jobs,
  # which had a real, structural bias -- its title-role matching was an
  # all-or-nothing gate on whether a job's title matched a role literally
  # named in the candidate's profile, so whichever role family was most
  # explicitly represented in a profile's target_roles/resume text got a
  # built-in advantage over others the candidate was equally qualified for
  # (e.g. Product Manager over AI Engineer/ML Engineer/SWE/SDE). Replaced by
  # hybrid search (vector + BM25 RRF, see get_jobs_by_hybrid_search in
  # backend/src/core/repositories/job/repository.py) as the live dashboard's
  # ranking, which has no such role-family gate. HardRejectFilter (rule-
  # based, no AI -- senior-title rejection, visa/clearance/location/etc.)
  # still runs on hybrid search's results; only the LLM-scored ranking was
  # removed. Left here, commented out, rather than deleted outright in case
  # this needs revisiting -- do not silently re-enable without confirming
  # the bias above has actually been addressed some other way.
  # job_scorer:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: career_job_scorer
  #   command: python3 src/workers/job_scoring_worker.py
  #   environment:
  #     - APP_ENV=production
  #     - REDIS_URL=redis://redis:6379
  #   env_file:
  #     - .env
  #   depends_on:
  #     redis:
  #       condition: service_started
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - default
  #     - dokploy-network
  #   restart: always

  db:
    image: pgvector/pgvector:pg16
    container_name: career_db
    ports:
      - "127.0.0.1:5433:5432"
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${OPERATIONAL_DB_NAME:-careerautomated}
      - POSTGRES_USER=${OPERATIONAL_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${OPERATIONAL_DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-careerautomated}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata:
  pgbackups:

networks:
  dokploy-network:
    external: true
